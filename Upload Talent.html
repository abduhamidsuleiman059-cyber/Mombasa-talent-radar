<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css?v=3">
    <title>Upload Talent</title>
</head>
<body>
    <header>
<h1 class="beauty-h1">Upload Your Talent</h1>
<p class="hero-text desc">Share your talent with the Mombasa community.</p>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">🏠 Home</a></li>
            <li><a href="Discover Talent.html">🔍 Discover Talent</a></li>
            <li><a href="Upload Talent.html">➕ Upload Talent</a></li>
            <li><a href="videos.html">🎥 Videos</a></li>
            <li><a href="Artist profile.html">👤 Artist Profile</a></li>
            <li><a href="Contact.html">📧 Contact</a></li>
        </ul>
    </nav>

    <section class="upload-form-section">
<h2 class="beauty-h2">Upload Form</h2>
            <form id="talentForm" class="upload-form" enctype="multipart/form-data">
            <label for="name">Artist Name</label>
            <input id="name" name="name" type="text" placeholder="Your name" required>

            <label for="category">Category</label>
            <select id="category" name="category" required>
                <option value="">Choose</option>
                <option value="Singer">Singer</option>
                <option value="Dancer">Dancer</option>
                <option value="Painter">Painter</option>
                <option value="Poet">Poet</option>
            </select>

            <label for="description">Description</label>
            <textarea id="description" name="description" rows="4" placeholder="Describe your talent"></textarea>

            <label for="photo">Talent Photo</label>
            <input id="photo" name="photo" type="file" accept="image/*" required>

            <label for="voice">Voice/Audio (Optional)</label>
            <input id="voice" name="voice" type="file" accept="audio/*">

            <label for="video">Video (Optional)</label>
            <input id="video" name="video" type="file" accept="video/*">

            <button type="submit">Upload</button>
        </form>

        <div id="uploadResult" class="upload-result"></div>
    </section>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Universal nav active
            const currentPath = window.location.pathname.split('/').pop() || 'index.html';
            document.querySelectorAll('nav a').forEach(link => {
                if (link.getAttribute('href') === currentPath) {
                    link.classList.add('active');
                }
            });

            const talentForm = document.getElementById('talentForm');
            const uploadResult = document.getElementById('uploadResult');

            talentForm.addEventListener('submit', async function(e) {
                e.preventDefault();

                const name = document.getElementById('name').value.trim();
                const category = document.getElementById('category').value;
                const photoInput = document.getElementById('photo');

                if (!name || !category || !photoInput.files.length) {
                    uploadResult.textContent = 'Tafadhali jaza sehemu zinazohitajika.';
                    return;
                }

                const formData = new FormData(talentForm);
                uploadResult.textContent = 'Inasubiriwa...';

                // Try API first
                try {
                    const response = await fetch('/api/talents', {
                        method: 'POST',
                        body: formData
                    });

                    if (response.ok) {
                        uploadResult.innerHTML = '<h3>Imefanikiwa!</h3><p>Talenti lako limewasilishwa. Litaonekana katika Videos feed.</p>';
                        talentForm.reset();
                        return;
                    }
                } catch (error) {
                    console.warn('API failed, using local fallback:', error);
                }

                // Local fallback
                saveTalentLocally();
            });

            function saveTalentLocally() {
                const name = document.getElementById('name').value.trim();
                const category = document.getElementById('category').value;
                const description = document.getElementById('description').value.trim() || '-';
                const photoInput = document.getElementById('photo');
                const voiceInput = document.getElementById('voice');
                const videoInput = document.getElementById('video');

                const savedTalent = {
                    id: Date.now() + '-' + Math.random().toString(36).slice(2, 8),
                    name,
                    category,
                    description,
                    imageData: null,
                    voiceData: null,
                    videoData: null,
                    uploadedAt: new Date().toISOString()
                };

                const readers = [];

                if (photoInput.files.length) {
                    readers.push(readFile(photoInput.files[0]).then(data => savedTalent.imageData = data));
                }
                if (voiceInput.files.length) {
                    readers.push(readFile(voiceInput.files[0]).then(data => savedTalent.voiceData = data));
                }
                if (videoInput.files.length) {
                    readers.push(readFile(videoInput.files[0]).then(data => savedTalent.videoData = data));
                }

                Promise.all(readers).then(() => {
                    const existingTalents = JSON.parse(localStorage.getItem('mombasaTalents') || '[]');
                    existingTalents.unshift(savedTalent);
                    localStorage.setItem('mombasaTalents', JSON.stringify(existingTalents));
                    uploadResult.innerHTML = '<h3>Imehifadhiwa mahali</h3><p>Backend haipatikani. Talenti litaonekana katika Videos page (local mode).</p>';
                    talentForm.reset();
                });
            }

            function readFile(file) {
                return new Promise(resolve => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.readAsDataURL(file);
                });
            }
        });
    </script>

</body>
</html>

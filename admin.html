<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css?v=7">
    <title>Admin - Mombasa Talent Radar</title>
    <style>
        .upload-result {
            padding: 12px 20px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: 500;
        }
        .upload-result.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .upload-result.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .admin-card {
            position: relative;
        }
        .admin-actions {
            margin-top: 10px;
        }
        .delete-btn {
            background: #dc3545;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
        }
        .delete-btn:hover {
            background: #c82333;
        }
        .contact-admin-section .discover-container .discover-card {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <header>
        <h1>Admin Panel</h1>
        <p>View uploaded talents and manage the project data.</p>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">🏠 Home</a></li>
            <li><a href="Discover Talent.html">🔍 Discover Talent</a></li>
            <li><a href="Upload Talent.html">➕ Upload Talent</a></li>
            <li><a href="videos.html">🎥 Videos</a></li>
            <li><a href="Artist profile.html">👤 Artist Profile</a></li>
            <li><a href="Contact.html">📧 Contact</a></li>
        </ul>
    </nav>

    <section class="upload-form-section">
        <h2>Uploaded Talent Entries</h2>
        <div id="adminStatus" class="upload-result" style="margin-bottom: 20px;"></div>
        <div id="adminList" class="discover-container"></div>
    </section>

    <section class="contact-admin-section">
        <h2>Contact Messages</h2>
        <div id="contactStatus" class="upload-result" style="margin-bottom: 20px;"></div>
        <div id="contactList" class="discover-container"></div>
    </section>

    <script>
        async function loadAdminData() {
            const adminList = document.getElementById('adminList');
            const contactList = document.getElementById('contactList');
            const adminStatus = document.getElementById('adminStatus');
            const contactStatus = document.getElementById('contactStatus');

            try {
                // Load talents
                const talentsRes = await fetch('/api/talents');
                const talents = await talentsRes.json();
                adminList.innerHTML = talents.map(talent => `
                    <div class="discover-card admin-card">
                        <img src="${talent.imageData}" alt="${talent.name}">
                        <h3>${talent.name}</h3>
                        <p>${talent.category}</p>
                        <p>${talent.description.substring(0, 80)}${talent.description.length > 80 ? '...' : ''}</p>
                        <div class="admin-actions">
                            <button onclick="deleteTalent('${talent.id}')" class="delete-btn">🗑️ Delete</button>
                        </div>
                    </div>
                `).join('') || '<p>No talents uploaded yet.</p>';

                adminStatus.textContent = `Loaded ${talents.length} talents`;
                adminStatus.className = 'upload-result success';

                // Load contacts
                const contactsRes = await fetch('/api/contacts');
                const contacts = await contactsRes.json();
                contactList.innerHTML = contacts.map(contact => `
                    <div class="discover-card admin-card">
                        <h3>${contact.name} (${contact.email})</h3>
                        <p>${contact.message.substring(0, 100)}${contact.message.length > 100 ? '...' : ''}</p>
                        <small>${new Date(contact.submittedAt).toLocaleString()}</small>
                    </div>
                `).join('') || '<p>No contacts yet.</p>';

                contactStatus.textContent = `Loaded ${contacts.length} contacts`;
                contactStatus.className = 'upload-result success';
            } catch (error) {
                adminStatus.textContent = 'Error loading data: ' + error.message;
                adminStatus.className = 'upload-result error';
                contactStatus.textContent = 'Error loading data: ' + error.message;
                contactStatus.className = 'upload-result error';
            }
        }

        window.deleteTalent = async (id) => {
            if (!confirm('Delete this talent?')) return;
            try {
                const res = await fetch(`/api/talents/${id}`, { method: 'DELETE' });
                if (res.ok) {
                    loadAdminData();
                    alert('Talent deleted');
                } else {
                    alert('Delete failed');
                }
            } catch (error) {
                alert('Error: ' + error.message);
            }
        };

        document.addEventListener('DOMContentLoaded', loadAdminData);
    </script>
</body>
</html>

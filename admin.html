<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Admin - Mombasa Talent Radar</title>
</head>
<body>
    <header>
        <h1>Admin Panel</h1>
        <p>View uploaded talents and manage the project data.</p>
    </header>
    <nav>
        <ul>
            <a href="index.html">Home</a>
            <a href="Discover Talent.html">Discover Talent</a>
            <a href="Upload Talent.html">Upload Talent</a>
            <a href="videos.html">Videos</a>
            <a href="tiktok-feed.html">Discover Feed</a>
            <a href="admin.html" class="active">Admin</a>
            <a href="Artist profile.html">Artist Profile</a>
            <a href="Contact.html">Contact</a>
        </ul>
    </nav>

    <section class="upload-form-section">
        <h2>Uploaded Talent Entries</h2>
        <div id="adminStatus" class="upload-result" style="margin-bottom: 20px;"></div>
        <div id="adminList" class="discover-container"></div>
    </section>

    <section class="contact-admin-section">
        <h2>Contact Messages</h2>
        <div id="contactStatus" class="upload-result" style="margin-bottom: 20px;"></div>
        <div id="contactList" class="discover-container"></div>
    </section>

    <script>
        async function loadAdminData() {
            const adminStatus = document.getElementById('adminStatus');
            const adminList = document.getElementById('adminList');
            const contactStatus = document.getElementById('contactStatus');
            const contactList = document.getElementById('contactList');
            adminStatus.textContent = 'Loading admin data...';
            contactStatus.textContent = 'Loading messages...';

            let talents = [];
            let contacts = [];

            try {
                const [talentResponse, contactResponse] = await Promise.all([
                    fetch('/api/talents'),
                    fetch('/api/contacts')
                ]);

                if (!talentResponse.ok) {
                    throw new Error('Talents endpoint returned ' + talentResponse.status);
                }
                if (!contactResponse.ok) {
                    throw new Error('Contacts endpoint returned ' + contactResponse.status);
                }

                talents = await talentResponse.json();
                contacts = await contactResponse.json();
            } catch (error) {
                adminStatus.textContent = 'Unable to load backend data. Using local fallback for talents.';
                contactStatus.textContent = 'Unable to load backend messages. Showing local fallback if available.';
                console.warn('Admin panel load failed:', error);
                talents = JSON.parse(localStorage.getItem('mombasaTalents') || '[]');
                contacts = JSON.parse(localStorage.getItem('mombasaContacts') || '[]');
            }

            adminStatus.innerHTML = `<strong>${talents.length}</strong> talent entries loaded.`;
            adminList.innerHTML = '';

            if (!talents.length) {
                adminList.innerHTML = '<p><strong>No talents available.</strong> Upload a new talent from the Upload Talent page.</p>';
            } else {
                talents.forEach((talent) => {
                    const card = document.createElement('div');
                    card.className = 'discover-card';
                    card.innerHTML = `
                        <img src="${talent.imageData || 'images/singer.jpg'}" alt="${talent.name}">
                        <h3>${talent.name || 'Unknown'}</h3>
                        <p>${talent.category || 'Unknown'}</p>
                        <p style="font-size: 0.9rem; color: #b8c9e0;">${(talent.description || 'No description').substring(0, 90)}${(talent.description || '').length > 90 ? '...' : ''}</p>
                        <button class="view-button">View Details</button>
                        <button class="delete-button">Delete</button>
                    `;

                    const viewBtn = card.querySelector('.view-button');
                    const deleteBtn = card.querySelector('.delete-button');
                    viewBtn.addEventListener('click', () => showDetails(talent));
                    deleteBtn.addEventListener('click', () => deleteTalent(talent.id, card));
                    adminList.appendChild(card);
                });
            }

            contactList.innerHTML = '';
            if (!contacts.length) {
                contactStatus.innerHTML = '<strong>No contact messages yet.</strong> Messages will appear here when users send them via the Contact page.';
            } else {
                contactStatus.innerHTML = `<strong>${contacts.length}</strong> contact messages received.`;
                contacts.forEach((message) => {
                    const card = document.createElement('div');
                    card.className = 'discover-card';
                    card.innerHTML = `
                        <h3>${message.name || 'Unknown sender'}</h3>
                        <p><strong>Email:</strong> ${message.email || 'Not provided'}</p>
                        <p><strong>Subject:</strong> ${message.subject || 'No subject'}</p>
                        <p>${(message.message || 'No message').substring(0, 180)}${(message.message || '').length > 180 ? '...' : ''}</p>
                        <p style="font-size: 0.8rem; color: #b8c9e0;">Sent: ${message.sentAt || 'Unknown'}</p>
                    `;
                    contactList.appendChild(card);
                });
            }
        }

        function showDetails(talent) {
            let detailText = `Name: ${talent.name || 'Unknown'}\n`;
            detailText += `Category: ${talent.category || 'Unknown'}\n`;
            detailText += `Description: ${talent.description || '-'}\n`;
            detailText += `Uploaded: ${talent.uploadedAt || '-'}\n`;
            detailText += `Image: ${talent.imageData || 'None'}\n`;
            detailText += `Video: ${talent.videoData || 'None'}\n`;
            detailText += `Voice: ${talent.voiceData || 'None'}\n`;
            alert(detailText);
        }

        async function deleteTalent(id, card) {
            const confirmed = confirm('Delete this talent entry?');
            if (!confirmed) return;

            let deleted = false;
            try {
                const response = await fetch(`/api/talents/${encodeURIComponent(id)}`, {
                    method: 'DELETE'
                });
                if (response.ok) {
                    deleted = true;
                }
            } catch (error) {
                console.warn('Backend delete failed, falling back to local delete:', error);
            }

            if (!deleted) {
                const savedTalents = JSON.parse(localStorage.getItem('mombasaTalents') || '[]');
                const filtered = savedTalents.filter(item => item.id !== id);
                localStorage.setItem('mombasaTalents', JSON.stringify(filtered));
                deleted = true;
            }

            if (deleted) {
                card.remove();
                const adminStatus = document.getElementById('adminStatus');
                adminStatus.innerHTML = '<strong>Entry deleted.</strong>';
            }
        }

        document.addEventListener('DOMContentLoaded', loadAdminData);
    </script>
</body>
</html>
